<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1d263a; --line:#2a3550;
  --txt:#e8edf7; --mut:#9aa7c2; --accent:#5b8cff; --accent2:#38d39f;
  --warn:#ff6b6b; --gold:#ffd166; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(160deg,#0c111c,#11182a 60%,#0c111c);color:var(--txt);}
header{padding:26px 30px 14px;border-bottom:1px solid var(--line);
  background:rgba(20,26,42,.6);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header .sub{color:var(--mut);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;padding:14px 30px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
  background:var(--panel);color:var(--mut);cursor:pointer;font-weight:600;font-size:14px;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.active{background:var(--panel2);color:var(--txt);box-shadow:inset 0 2px 0 var(--accent)}
.wrap{padding:22px 30px 60px;max-width:1500px;margin:0 auto}
.page{display:none} .page.active{display:block}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.kpi .label{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
.kpi .note{color:var(--mut);font-size:12px;margin-top:6px}
.kpi .val.good{color:var(--accent2)} .kpi .val.warn{color:var(--warn)} .kpi .val.gold{color:var(--gold)}
.row2{grid-template-columns:1fr 1fr} .row3{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.row2,.row3{grid-template-columns:1fr}}
.card h3{margin:0 0 4px;font-size:15px} .card .cap{color:var(--mut);font-size:12px;margin-bottom:12px}
.chartbox{position:relative;height:320px} .chartbox.tall{height:380px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.school,th.school{text-align:left;font-weight:600;white-space:nowrap}
.cell{border-radius:6px;font-weight:600;color:#0b1020}
.na{color:var(--mut);font-style:italic;font-weight:400}
.insights li{margin:0 0 10px;line-height:1.55;color:#dbe3f4;font-size:14px}
.insights ul{margin:0;padding-left:18px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-left:6px}
.badge.up{background:rgba(56,211,159,.16);color:var(--accent2)}
.badge.down{background:rgba(255,107,107,.16);color:var(--warn)}
.legend{display:flex;gap:14px;align-items:center;color:var(--mut);font-size:12px;margin-top:10px;flex-wrap:wrap}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}
.foot{color:var(--mut);font-size:12px;margin-top:26px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut);margin:0 6px 6px 0}
h2.section{font-size:16px;margin:26px 0 4px;color:var(--txt)}
</style>
</head>

const SUB = DB.subjects;
const PAL = ['#5b8cff','#38d39f','#ffd166','#ff6b6b','#b388ff','#4dd0e1','#f78fb3','#9ccc65'];
Chart.defaults.color='#9aa7c2'; Chart.defaults.borderColor='#2a3550';
Chart.defaults.font.family="-apple-system,Segoe UI,Roboto,sans-serif";

function mkChart(id,cfg){ // resilient: never let a chart error blank the page
  try{
    const cv=document.getElementById(id);
    if(!cv){return;}
    if(typeof Chart==='undefined'){
      cv.closest('.chartbox').innerHTML='<div style="color:#9aa7c2;font-size:13px;padding:20px;text-align:center">Chart library unavailable.</div>';
      return;
    }
    return new Chart(cv,cfg);
  }catch(e){ console.error('chart '+id,e); }
}
function color(v){ // 0-100 -> red..green
  if(v==null) return '#243049';
  const t=Math.max(0,Math.min(1,(v-60)/35));
  const r=Math.round(220-130*t), g=Math.round(90+150*t), bl=Math.round(90+50*t);
  return `rgb(${r},${g},${bl})`;
}
function rank(o){return Object.entries(o).filter(e=>e[1]).sort((a,b)=>b[1]-a[1]);}

// ---------- Tabs ----------
const tabsDef=[['overview','Overview &amp; Comparison'],['ease1','EASE 1'],['ease2','EASE 2']];
const tabsEl=document.getElementById('tabs');
tabsDef.forEach(([id,lbl],i)=>{
  const t=document.createElement('div');t.className='tab'+(i===0?' active':'');t.innerHTML=lbl;
  t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');document.getElementById('page-'+id).classList.add('active');};
  tabsEl.appendChild(t);
});

function kpi(label,val,cls,note){return `<div class="card kpi"><div class="label">${label}</div><div class="val ${cls||''}">${val}</div>${note?`<div class="note">${note}</div>`:''}</div>`;}
function chartCard(title,cap,id,tall){return `<div class="card"><h3>${title}</h3><div class="cap">${cap}</div><div class="chartbox${tall?' tall':''}"><canvas id="${id}"></canvas></div></div>`;}

// ---------- EASE page builder ----------
function buildEase(ease,pid){
  const m=DB.metrics[ease], raw=DB.raw[ease], grades=m.grades, schools=raw.schools;
  const sr=rank(m.school_overall), sub=rank(m.subj_overall);
  const ins=DB.insights[ease];
  const el=document.getElementById(pid);
  let h='';
  // KPIs
  h+='<div class="grid kpis">';
  h+=kpi('Overall Average',m.overall,'good','participation-weighted, all subjects');
  h+=kpi('Schools Participating',m.nSchools+' / 8','', grades.length+' grade levels');
  h+=kpi('Students Assessed','~'+m.students_est,'', m.total_sittings.toLocaleString()+' subject sittings');
  h+=kpi('Top School',sr[0][0].replace('Pribadi ','P. ').replace(' School',''),'gold',sr[0][0]+' · '+sr[0][1]);
  h+=kpi('Strongest Subject',sub[0][0],'good',sub[0][1]);
  h+=kpi('Needs Attention',sub[sub.length-1][0],'warn',sub[sub.length-1][1]);
  h+='</div>';
  // insights
  h+='<div class="card insights"><h3>🔍 Key Insights — '+ease+'</h3><ul>'+ins.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  h+='<div style="height:18px"></div>';
  // charts row: school ranking + subject
  h+='<div class="grid row2">';
  h+=chartCard('🏆 School Ranking','Overall average across all subjects &amp; grades','c_'+pid+'_sch',true);
  h+=chartCard('📚 Subject Performance','Cohort average by subject','c_'+pid+'_sub',true);
  h+='</div><div style="height:18px"></div>';
  // grade comparison
  h+='<div class="grid row3">';
  h+=chartCard('📈 Subject × Grade','Average score per subject by grade level','c_'+pid+'_grd',true);
  h+=chartCard('👥 Participation by School','Estimated cohort size per grade','c_'+pid+'_part',true);
  h+='</div><div style="height:18px"></div>';
  // heatmap
  h+='<div class="card"><h3>🌡️ Performance Heatmap — School × Subject</h3><div class="cap">Weighted average per cell. Greener = higher. “—” = did not participate.</div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th class="school">School</th>';
  SUB.forEach(s=>h+='<th>'+s+'</th>'); h+='<th>Overall</th></tr></thead><tbody>';
  schools.forEach(sc=>{
    h+='<tr><td class="school">'+sc+'</td>';
    SUB.forEach(s=>{const v=m.heat[sc][s];
      h+=v?`<td><span class="cell" style="background:${color(v)};padding:4px 8px;display:inline-block;min-width:42px">${v}</span></td>`:'<td class="na">—</td>';});
    const ov=m.school_overall[sc];
    h+=ov?`<td><span class="cell" style="background:${color(ov)};padding:4px 8px;display:inline-block;min-width:42px;font-weight:700">${ov}</span></td>`:'<td class="na">—</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="legend"><span class="swatch" style="background:'+color(62)+'"></span>≤65<span class="swatch" style="background:'+color(75)+'"></span>~75<span class="swatch" style="background:'+color(85)+'"></span>85<span class="swatch" style="background:'+color(95)+'"></span>95+</div></div>';
  el.innerHTML=h;

  // ----- charts -----
  // school ranking
  mkChart(('c_'+pid+'_sch'),{type:'bar',
    data:{labels:sr.map(e=>e[0]),datasets:[{data:sr.map(e=>e[1]),
      backgroundColor:sr.map(e=>color(e[1])),borderRadius:6}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},
      scales:{x:{min:60,max:95,title:{display:true,text:'Average score'}}}}});
  // subject
  mkChart(('c_'+pid+'_sub'),{type:'bar',
    data:{labels:sub.map(e=>e[0]),datasets:[{data:sub.map(e=>e[1]),
      backgroundColor:sub.map((e,i)=>PAL[i%PAL.length]),borderRadius:6}]},
    options:{plugins:{legend:{display:false}},scales:{y:{min:60,max:95,title:{display:true,text:'Average'}}}}});
  // subject x grade
  mkChart(('c_'+pid+'_grd'),{type:'bar',
    data:{labels:SUB,datasets:grades.map((g,i)=>({label:g,
      data:SUB.map(s=>m.subj_by_grade[s][g]),backgroundColor:PAL[i],borderRadius:5}))},
    options:{plugins:{legend:{position:'top'}},scales:{y:{min:55,max:95,title:{display:true,text:'Average'}}}}});
  // participation stacked
  mkChart(('c_'+pid+'_part'),{type:'bar',
    data:{labels:schools.map(s=>s.replace('Pribadi ','P. ').replace(' School','').replace(' Bilingual','')),
      datasets:grades.map((g,i)=>({label:g,data:schools.map(s=>m.part_school_grade[s][g]),
        backgroundColor:PAL[i],borderRadius:4}))},
    options:{plugins:{legend:{position:'top'}},scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'Students'}}}}});
}

// ---------- Overview / Comparison ----------
function buildOverview(){
  const C=DB.comparison, m1=DB.metrics['EASE 1'], m2=DB.metrics['EASE 2'];
  const el=document.getElementById('page-overview');
  const ins=DB.insights.comparison;
  let h='';
  h+='<div class="grid kpis">';
  h+=kpi('EASE 1 Overall',m1.overall,'', 'Grades 4–6 · 6 schools');
  h+=kpi('EASE 2 Overall',m2.overall,'', 'Grades 4–5 · 8 schools');
  const dN=m2.nSchools-m1.nSchools;
  h+=kpi('Participation','+'+dN+' schools','good','Fatih &amp; TNA joined in EASE 2');
  const bestSub=Object.entries(C.subjects).filter(e=>e[1].delta!=null).sort((a,b)=>b[1].delta-a[1].delta);
  h+=kpi('Biggest Gain',bestSub[0][0],'good','+'+bestSub[0][1].delta+' pts');
  h+=kpi('Biggest Drop',bestSub[bestSub.length-1][0],'warn',bestSub[bestSub.length-1][1].delta+' pts');
  h+='</div>';
  h+='<div class="card insights"><h3>🔁 EASE 1 → EASE 2 — Cross-Round Insights</h3>'+
     '<div class="cap" style="margin-bottom:10px">Like-for-like comparison: Grades 4 &amp; 5 only, restricted to the 6 schools present in both rounds (fair-cohort basis).</div>'+
     '<ul>'+ins.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  h+='<div style="height:18px"></div>';
  h+='<div class="grid row2">';
  h+=chartCard('🏫 School: EASE 1 vs EASE 2','Same 6 schools, Grades 4–5 only','c_ov_sch',true);
  h+=chartCard('📚 Subject: EASE 1 vs EASE 2','Same cohort, Grades 4–5 only','c_ov_sub',true);
  h+='</div><div style="height:18px"></div>';
  // delta table
  h+='<div class="card"><h3>📋 Subject Movement (fair cohort)</h3><div class="cap">Change in weighted average, EASE 1 → EASE 2.</div>'+
     '<table><thead><tr><th class="school">Subject</th><th>EASE 1</th><th>EASE 2</th><th>Change</th></tr></thead><tbody>';
  bestSub.forEach(([s,v])=>{const up=v.delta>=0;
    h+=`<tr><td class="school">${s}</td><td>${v.e1}</td><td>${v.e2}</td><td><span class="badge ${up?'up':'down'}">${up?'▲ +':'▼ '}${v.delta}</span></td></tr>`;});
  h+='</tbody></table></div>';
  h+='<div style="height:18px"></div>';
  // school delta table
  h+='<div class="card"><h3>📋 School Movement (fair cohort)</h3><div class="cap">Overall change, EASE 1 → EASE 2 (Grades 4–5).</div>'+
     '<table><thead><tr><th class="school">School</th><th>EASE 1</th><th>EASE 2</th><th>Change</th></tr></thead><tbody>';
  Object.entries(C.schools).sort((a,b)=>b[1].delta-a[1].delta).forEach(([s,v])=>{const up=v.delta>=0;
    h+=`<tr><td class="school">${s}</td><td>${v.e1}</td><td>${v.e2}</td><td><span class="badge ${up?'up':'down'}">${up?'▲ +':'▼ '}${v.delta}</span></td></tr>`;});
  h+='</tbody></table></div>';
  h+='<div class="foot"><b>Methodology &amp; notes.</b> Cell scores are school "Quality Report" averages from the source workbooks. Cohort/subject/grade aggregates are weighted by the number of participating students. '+
     'Zero values denote non-participation (not a score of 0) and are excluded from every average. EASE 1 covers Grades 4–6; EASE 2 covers Grades 4–5. '+
     'Cross-round comparisons are restricted to Grades 4–5 and the 6 schools assessed in both rounds so changes reflect real movement, not differences in coverage. '+
     'Student counts are estimated as the largest subject participation per school-grade (a cohort proxy, since per-student records are not in the source).</div>';
  el.innerHTML=h;

  const sc=Object.entries(C.schools).sort((a,b)=>b[1].e2-a[1].e2);
  mkChart(('c_ov_sch'),{type:'bar',
    data:{labels:sc.map(e=>e[0].replace('Pribadi ','P. ').replace(' School','')),
      datasets:[{label:'EASE 1',data:sc.map(e=>e[1].e1),backgroundColor:PAL[0],borderRadius:5},
                {label:'EASE 2',data:sc.map(e=>e[1].e2),backgroundColor:PAL[1],borderRadius:5}]},
    options:{plugins:{legend:{position:'top'}},scales:{y:{min:60,max:90,title:{display:true,text:'Average'}}}}});
  const su=Object.entries(C.subjects);
  mkChart(('c_ov_sub'),{type:'bar',
    data:{labels:su.map(e=>e[0]),
      datasets:[{label:'EASE 1',data:su.map(e=>e[1].e1),backgroundColor:PAL[0],borderRadius:5},
                {label:'EASE 2',data:su.map(e=>e[1].e2),backgroundColor:PAL[1],borderRadius:5}]},
    options:{plugins:{legend:{position:'top'}},scales:{y:{min:60,max:92,title:{display:true,text:'Average'}}}}});
}

function safe(fn,label){ try{ fn(); }catch(e){ console.error('build '+label,e); } }
safe(buildOverview,'overview');
safe(()=>buildEase('EASE 1','page-ease1'),'ease1');
safe(()=>buildEase('EASE 2','page-ease2'),'ease2');
document.getElementById('page-overview').classList.add('active');
